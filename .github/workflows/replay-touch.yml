name: Replay real touch probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-touch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  touch:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
          check-latest: false
      - name: Build and probe real double-tap dispatch only
        run: python3 tests/ui/run_inline_ui_tests.py --replay-touch-only
      - name: Upload touch evidence only, not a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-touch-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
